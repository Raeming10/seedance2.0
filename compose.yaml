services:
  studio:
    build: .
    ports:
      - '127.0.0.1:8000:8000'
    environment:
      FAL_KEY: ${FAL_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      STUDIO_API_TOKEN: ${STUDIO_API_TOKEN:?Set a random STUDIO_API_TOKEN in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - studio-data:/data/studio
    restart: unless-stopped
volumes:
  studio-data:
